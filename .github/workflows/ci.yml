name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module integrity
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  static-analysis:
    name: Staticcheck (Go 1.25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  image-smoke:
    name: OCI image smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build OCI image
        run: docker build --build-arg VERSION=ci -t schema-guard:ci .

      - name: Verify CLI and empty SQLite database
        run: |
          docker run --rm schema-guard:ci version
          docker run --rm -e SCHEMA_GUARD_DSN=file::memory: schema-guard:ci snapshot --engine sqlite
          docker run --rm -e SCHEMA_GUARD_DSN=file::memory: \
            -v "$GITHUB_WORKSPACE/examples:/workspace/examples:ro" \
            schema-guard:ci check --engine sqlite --expected /workspace/examples/empty-sqlite.json --format json

  database-engines:
    name: Database engine integration
    uses: ./.github/workflows/database-engines.yml
