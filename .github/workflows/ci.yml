name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  postgres-integration:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: schema_guard
          POSTGRES_PASSWORD: schema_guard_ci
          POSTGRES_DB: schema_guard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_guard -d schema_guard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHEMA_GUARD_POSTGRES_DSN: postgres://schema_guard:schema_guard_ci@127.0.0.1:5432/schema_guard_ci?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Run PostgreSQL integration tests
        run: go test -race -count=1 -tags=integration ./postgres/...
