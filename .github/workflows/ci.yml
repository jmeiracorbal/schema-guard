name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  postgres-integration:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: schema_guard
          POSTGRES_PASSWORD: schema_guard_ci
          POSTGRES_DB: schema_guard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_guard -d schema_guard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHEMA_GUARD_POSTGRES_DSN: postgres://schema_guard:schema_guard_ci@127.0.0.1:5432/schema_guard_ci?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Run PostgreSQL integration tests
        run: go test -race -count=1 -tags=integration ./postgres/...

  mysql-integration:
    name: MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: schema_guard_ci
          MYSQL_USER: schema_guard
          MYSQL_PASSWORD: schema_guard_ci
          MYSQL_ROOT_PASSWORD: schema_guard_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u schema_guard -pschema_guard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 25
    env:
      SCHEMA_GUARD_MYSQL_DSN: schema_guard:schema_guard_ci@tcp(127.0.0.1:3306)/schema_guard_ci?parseTime=true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Test MySQL metadata inspection
        run: go test -race -count=1 -tags=integration ./mysql/...

  mariadb-integration:
    name: MariaDB 11.4
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: schema_guard_ci
          MARIADB_USER: schema_guard
          MARIADB_PASSWORD: schema_guard_ci
          MARIADB_ROOT_PASSWORD: schema_guard_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 25
    env:
      SCHEMA_GUARD_MARIADB_DSN: schema_guard:schema_guard_ci@tcp(127.0.0.1:3306)/schema_guard_ci?parseTime=true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Test MariaDB metadata inspection
        run: go test -race -count=1 -tags=integration ./mariadb/...
