name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag and publish release
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const identifier = '(?:0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)';
            const semver = new RegExp(
              '^v(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-' +
              identifier + '(?:\\.' + identifier + ')*)?$'
            );
            if (!semver.test(tag)) {
              throw new Error(`Invalid semantic version tag: ${tag}`);
            }

            const comparison = await github.rest.repos.compareCommits({
              owner, repo, base: context.sha, head: 'main'
            });
            if (!['identical', 'ahead'].includes(comparison.data.status)) {
              throw new Error(`Tagged commit is not in main: ${context.sha}`);
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists; nothing to publish.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              target_commitish: context.sha,
              prerelease: tag.includes('-'),
              generate_release_notes: true,
            });
            core.info(`Published ${created.data.html_url}`);
